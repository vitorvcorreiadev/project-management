schema: spec-driven

context: |
  Tech stack: Vue.js, Typescript, Plain CSS, Pinia
  Tests: Vitest and Playwright
  Domain: A single tenant project management system with local persistence

rules:
  proposal:
    - Keep proposals under 500 words
    - Never presume features, ask any question before defining the plan
  specs:
    - Always use given/when/then
    - Check the existing code standards in AGENTS.md before proposing a new specification.
  tasks:
    - Break tasks into chunks of max 1 hour

operations:
  apply:
    guidance:
      - Keep test summaries concise
  archive:
    guidance:
      - Summarize what was implemented and which specifications were affected.
